
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">

    <title>Tambah Risiko | GRC-ERM</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-layout">

        <aside class="sidebar">
            <div class="brand">
                <h2>GRC-ERM</h2>
                <p>Risk Management System</p>
            </div>

            <nav class="sidebar-nav">
                <a href="index.html" class="nav-link">
                    Dashboard
                </a>

                <a href="analitik.html" class="nav-link">
                    Analitik Risiko
                </a>

                <a href="tambah-risiko.html" class="nav-link active">
                    Tambah Risiko
                </a>

                <a href="daftar-risiko.html" class="nav-link">
                    Daftar Risiko
                </a>
            </nav>
        </aside>

        <main class="main-content">

            <header class="topbar">
                <div>
                    <h1>Tambah Risiko</h1>
                    <p>
                        Catat dan nilai risiko baru
                        dalam sistem GRC-ERM.
                    </p>
                </div>
            </header>

            <section class="page-section">
                <div class="panel">
                    <h2>Formulir Identifikasi Risiko</h2>

                    <p>
                        Masukkan nama risiko, kemungkinan
                        terjadinya, dan dampaknya.
                    </p>

                    <form id="formRisiko">

                        <div class="form-group">
                            <label for="namaRisiko">
                                Nama Risiko
                            </label>

                            <input
                                type="text"
                                id="namaRisiko"
                                placeholder="Contoh: Serangan phishing"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="likelihood">
                                Likelihood (1–5)
                            </label>

                            <input
                                type="number"
                                id="likelihood"
                                min="1"
                                max="5"
                                step="1"
                                placeholder="Masukkan nilai 1–5"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="impact">
                                Impact (1–5)
                            </label>

                            <input
                                type="number"
                                id="impact"
                                min="1"
                                max="5"
                                step="1"
                                placeholder="Masukkan nilai 1–5"
                                required
                            >
                        </div>

                        <div class="form-actions">
                            <button type="submit" id="tambahRisiko">
                                Simpan Risiko
                            </button>

                            <button
                                type="button"
                                id="batalEdit"
                                hidden
                            >
                                Batal Edit
                            </button>
                        </div>

                    </form>

                    <p
                        id="hasilRisiko"
                        class="feedback-message"
                        role="status"
                        aria-live="polite"
                    ></p>
                </div>
            </section>

            <footer class="footer">
                <p>GRC-ERM · Risk Management System</p>
            </footer>

        </main>
    </div>

    <script src="data_risiko.js"></script>
    <script src="form_risiko.js"></script>

    <!-- JavaScript akan dihubungkan setelah struktur halaman siap -->

</body>
</html>
